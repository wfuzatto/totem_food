<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Totem Food</title><link rel="stylesheet" href="/styles.css"></head><body><div class="admin-shell"><header class="section-title"><div><small>Backoffice</small><h1>Totem Food</h1></div><button id="loginBtn" class="primary">Entrar / trocar usuário</button></header><div id="metrics" class="admin-grid"></div><div class="admin-columns"><section class="card"><h2>Novo produto</h2><form id="productForm" class="form-grid"><label>Categoria<select name="category_id" id="categorySelect" required></select></label><label>Nome<input name="name" required></label><label class="span-2">Descrição<textarea name="description"></textarea></label><label>Preço (R$)<input name="price" type="number" min="0" step="0.01" required></label><label>Praça<select name="station"><option>KITCHEN</option><option>BAR</option><option>BOTH</option><option>NONE</option></select></label><label>NCM<input name="ncm"></label><label>CEST<input name="cest"></label><label class="span-2">Alergênicos<input name="allergens"></label><label class="span-2">Foto<input name="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="primary span-2">Salvar produto</button></form></section><section class="card"><h2>Produtos</h2><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Praça</th><th>Status</th></tr></thead><tbody id="productsTable"></tbody></table></div></section></div><div class="admin-columns"><section class="card"><h2>Nova propaganda</h2><form id="adForm" class="form-grid"><label>Título<input name="title" required></label><label>Tipo<select name="media_type"><option>COLOR</option><option>IMAGE</option><option>VIDEO</option></select></label><label class="span-2">Mensagem<input name="message"></label><label class="span-2">URL da mídia<input name="media_url"></label><label>Cor<input name="background" value="#ffcf1a"></label><label>Duração (s)<input name="duration_seconds" value="10" type="number"></label><button class="primary span-2">Salvar propaganda</button></form></section><section class="card"><h2>Últimos pedidos</h2><div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Status</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section></div><section class="card" style="margin-top:20px"><h2>Combos</h2><div id="combos"></div><p>O backend já suporta criação de combos pela API; o editor visual fica como próxima evolução.</p></section></div><script src="/admin.js"></script></body></html>
